name: CI/CD # the deploy server checks this exact name

on:
  push:
    branches: [main]

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # --- Test: Playwright against the full stack (frontend, backend, db) ---
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait until the API answers through nginx
        run: curl -sf --retry 30 --retry-delay 2 --retry-all-errors http://localhost:5173/api/health

      # Playwright reuses the stack already listening on :5173 (reuseExistingServer).
      - name: Run Playwright tests
        run: npx playwright test

      - name: Show stack logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v

      # --- Build and push: only reached if every step above succeeded ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Multi-platform: the runner is amd64, but a Mac (Apple Silicon) pulls arm64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.multistage
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ vars.DOCKERHUB_USERNAME }}/node-auth-app:frontend

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ vars.DOCKERHUB_USERNAME }}/node-auth-app:backend
